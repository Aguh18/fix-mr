<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Fix-MR Workflow</title>
  <desc id="workflow-desc">Three-phase MR fix workflow with optional worktree isolation</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    text { font-family: 'Geist', sans-serif; }
    .mono { font-family: 'Geist Mono', monospace; }
    .serif { font-family: 'Instrument Serif', serif; }
  </style>

  <rect width="800" height="600" fill="#1a1b26"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6a737d"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ece6a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#c0caf5" font-size="18" font-weight="600" class="serif">Fix-MR Workflow</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- STANDARD PATH (Left column) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <text x="160" y="72" text-anchor="middle" fill="#7aa2f7" font-size="11" class="mono" letter-spacing="0.1em">STANDARD</text>

  <!-- Review -->
  <rect x="60" y="88" width="200" height="32" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="1.2"/>
  <text x="160" y="109" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="600">/fix-mr review</text>

  <line x1="160" y1="120" x2="160" y2="140" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="140" width="200" height="28" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="160" y="159" text-anchor="middle" fill="#a9b1d6" font-size="10">Parse &amp; classify</text>

  <line x1="160" y1="168" x2="160" y2="188" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="188" width="200" height="28" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="160" y="207" text-anchor="middle" fill="#a9b1d6" font-size="10">Show table</text>

  <!-- Fix -->
  <line x1="160" y1="216" x2="160" y2="244" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="244" width="200" height="32" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1.2"/>
  <text x="160" y="265" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="600">/fix-mr fix</text>

  <line x1="160" y1="276" x2="160" y2="296" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="296" width="200" height="28" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="160" y="315" text-anchor="middle" fill="#a9b1d6" font-size="10">Apply fixes</text>

  <line x1="160" y1="324" x2="160" y2="344" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="344" width="200" height="28" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="160" y="363" text-anchor="middle" fill="#a9b1d6" font-size="10">Build &amp; test</text>

  <line x1="160" y1="372" x2="160" y2="392" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="392" width="200" height="32" rx="6" fill="#24283b" stroke="#e0af68" stroke-width="1.5"/>
  <text x="160" y="413" text-anchor="middle" fill="#e0af68" font-size="11" font-weight="600">git commit</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- WORKTREE PATH (Right column) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <text x="520" y="72" text-anchor="middle" fill="#9ece6a" font-size="11" class="mono" letter-spacing="0.1em">--worktree</text>

  <rect x="400" y="88" width="240" height="32" rx="6" fill="#9ece6a" fill-opacity="0.08" stroke="#9ece6a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="520" y="109" text-anchor="middle" fill="#9ece6a" font-size="10" font-weight="500">Optional: isolated worktrees</text>

  <line x1="520" y1="120" x2="520" y2="140" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow-green)"/>

  <rect x="400" y="140" width="110" height="28" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="0.8"/>
  <text x="455" y="159" text-anchor="middle" fill="#a9b1d6" font-size="9" class="mono">wt-1: fix A</text>

  <rect x="530" y="140" width="110" height="28" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="0.8"/>
  <text x="585" y="159" text-anchor="middle" fill="#a9b1d6" font-size="9" class="mono">wt-2: fix B</text>

  <line x1="520" y1="168" x2="520" y2="188" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow-green)"/>

  <rect x="400" y="188" width="240" height="28" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="0.8"/>
  <text x="520" y="207" text-anchor="middle" fill="#a9b1d6" font-size="9" class="mono">wt-N: fix N</text>

  <line x1="520" y1="216" x2="520" y2="236" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow-green)"/>

  <rect x="400" y="236" width="240" height="32" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="520" y="257" text-anchor="middle" fill="#9ece6a" font-size="11" font-weight="500">Test each worktree</text>

  <line x1="520" y1="268" x2="520" y2="288" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow-green)"/>

  <rect x="400" y="288" width="240" height="32" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="520" y="309" text-anchor="middle" fill="#9ece6a" font-size="11" font-weight="500">Merge passing ✓</text>

  <line x1="520" y1="320" x2="520" y2="340" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow-green)"/>

  <rect x="400" y="340" width="240" height="32" rx="6" fill="#24283b" stroke="#e0af68" stroke-width="1.5"/>
  <text x="520" y="361" text-anchor="middle" fill="#e0af68" font-size="11" font-weight="600">git commit</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- MERGE POINT -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <line x1="160" y1="424" x2="340" y2="424" stroke="#6a737d" stroke-width="1"/>
  <line x1="520" y1="372" x2="340" y2="424" stroke="#9ece6a" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="300" y="412" width="80" height="24" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="340" y="429" text-anchor="middle" fill="#9ece6a" font-size="10" font-weight="500" class="mono">merge</text>

  <line x1="340" y1="436" x2="340" y2="460" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- REOPEN -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="240" y="460" width="200" height="32" rx="6" fill="#24283b" stroke="#ff9e64" stroke-width="1.2"/>
  <text x="340" y="481" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="600">/fix-mr reopen</text>

  <line x1="340" y1="492" x2="340" y2="512" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="240" y="512" width="200" height="28" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="340" y="531" text-anchor="middle" fill="#a9b1d6" font-size="10">Push &amp; reopen</text>

  <line x1="340" y1="540" x2="340" y2="560" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="280" y="560" width="120" height="28" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="2"/>
  <text x="340" y="579" text-anchor="middle" fill="#9ece6a" font-size="12" font-weight="600">Done ✓</text>

  <!-- Legend -->
  <line x1="40" y1="610" x2="760" y2="610" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
  <rect x="40" y="620" width="12" height="12" rx="2" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="60" y="630" fill="#a9b1d6" font-size="9">Standard</text>
  <rect x="140" y="620" width="12" height="12" rx="2" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="160" y="630" fill="#a9b1d6" font-size="9">Worktree (optional)</text>
  <rect x="300" y="620" width="12" height="12" rx="2" fill="#24283b" stroke="#e0af68" stroke-width="1"/>
  <text x="320" y="630" fill="#a9b1d6" font-size="9">Commit</text>
</svg>
