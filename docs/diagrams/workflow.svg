<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Fix-MR Workflow</title>
  <desc id="workflow-desc">Three-phase workflow: review comments, fix code (optional worktree isolation), reopen MR with summary</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    text { font-family: 'Geist', sans-serif; }
    .mono { font-family: 'Geist Mono', monospace; }
    .serif { font-family: 'Instrument Serif', serif; }
  </style>

  <!-- Background -->
  <rect width="960" height="480" fill="#1a1b26"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6a737d"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7aa2f7"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" fill="#c0caf5" font-size="20" font-weight="600" class="serif">Fix-MR Workflow</text>

  <!-- Phase labels -->
  <text x="160" y="80" text-anchor="middle" fill="#7aa2f7" font-size="11" class="mono" letter-spacing="0.1em">REVIEW</text>
  <text x="480" y="80" text-anchor="middle" fill="#9ece6a" font-size="11" class="mono" letter-spacing="0.1em">FIX</text>
  <text x="800" y="80" text-anchor="middle" fill="#ff9e64" font-size="11" class="mono" letter-spacing="0.1em">REOPEN</text>

  <!-- Phase 1 boxes -->
  <rect x="40" y="100" width="240" height="44" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="1"/>
  <text x="160" y="127" text-anchor="middle" fill="#c0caf5" font-size="12" font-weight="600">/fix-mr review</text>

  <rect x="40" y="164" width="240" height="44" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="160" y="191" text-anchor="middle" fill="#a9b1d6" font-size="12">Parse MR URL</text>

  <rect x="40" y="228" width="240" height="44" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="160" y="248" text-anchor="middle" fill="#a9b1d6" font-size="12">Fetch comments</text>
  <text x="160" y="264" text-anchor="middle" fill="#6a737d" font-size="9" class="mono">glab mr view --comments</text>

  <rect x="40" y="312" width="240" height="44" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="160" y="339" text-anchor="middle" fill="#a9b1d6" font-size="12">Classify findings</text>
  <text x="160" y="355" text-anchor="middle" fill="#6a737d" font-size="9" class="mono">valid / invalid / manual</text>

  <rect x="40" y="396" width="240" height="44" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="160" y="423" text-anchor="middle" fill="#a9b1d6" font-size="12">Show table</text>

  <!-- Phase 1 arrows -->
  <line x1="160" y1="144" x2="160" y2="164" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="160" y1="208" x2="160" y2="228" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="160" y1="272" x2="160" y2="312" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="160" y1="356" x2="160" y2="396" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase 2 boxes -->
  <rect x="360" y="100" width="240" height="44" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="480" y="127" text-anchor="middle" fill="#c0caf5" font-size="12" font-weight="600">/fix-mr fix [--worktree]</text>

  <rect x="360" y="164" width="240" height="44" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="480" y="191" text-anchor="middle" fill="#a9b1d6" font-size="12">Read files</text>

  <rect x="360" y="228" width="240" height="44" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="480" y="255" text-anchor="middle" fill="#a9b1d6" font-size="12">Apply fixes</text>
  <text x="480" y="271" text-anchor="middle" fill="#6a737d" font-size="9" class="mono">code / tests / migrations</text>

  <rect x="360" y="312" width="240" height="44" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="480" y="332" text-anchor="middle" fill="#a9b1d6" font-size="12">go build + vet + test</text>
  <text x="480" y="348" text-anchor="middle" fill="#6a737d" font-size="9" class="mono">go build &amp;&amp; go vet &amp;&amp; go test</text>

  <rect x="360" y="396" width="240" height="44" rx="6" fill="#24283b" stroke="#e0af68" stroke-width="1.5"/>
  <text x="480" y="423" text-anchor="middle" fill="#e0af68" font-size="12" font-weight="600">git commit</text>
  <text x="480" y="439" text-anchor="middle" fill="#6a737d" font-size="9" class="mono">NO push</text>

  <!-- Worktree branch (optional path) -->
  <rect x="620" y="164" width="120" height="260" rx="4" fill="#9ece6a" fill-opacity="0.08" stroke="#9ece6a" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="680" y="180" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">--worktree</text>

  <rect x="632" y="196" width="96" height="28" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="0.8"/>
  <text x="680" y="214" text-anchor="middle" fill="#a9b1d6" font-size="9" class="mono">worktree-1</text>

  <rect x="632" y="236" width="96" height="28" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="0.8"/>
  <text x="680" y="254" text-anchor="middle" fill="#a9b1d6" font-size="9" class="mono">worktree-2</text>

  <rect x="632" y="276" width="96" height="28" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="0.8"/>
  <text x="680" y="294" text-anchor="middle" fill="#a9b1d6" font-size="9" class="mono">worktree-N</text>

  <rect x="632" y="320" width="96" height="28" rx="4" fill="#24283b" stroke="#e0af68" stroke-width="1"/>
  <text x="680" y="338" text-anchor="middle" fill="#e0af68" font-size="9" class="mono">merge ✓</text>

  <!-- Worktree arrows -->
  <line x1="600" y1="191" x2="632" y2="210" stroke="#9ece6a" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="632" y1="224" x2="632" y2="236" stroke="#9ece6a" stroke-width="0.8"/>
  <line x1="632" y1="264" x2="632" y2="276" stroke="#9ece6a" stroke-width="0.8"/>
  <line x1="680" y1="304" x2="680" y2="320" stroke="#9ece6a" stroke-width="0.8"/>
  <line x1="632" y1="348" x2="480" y2="396" stroke="#9ece6a" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Phase 2 arrows -->
  <line x1="480" y1="144" x2="480" y2="164" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="208" x2="480" y2="228" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="272" x2="480" y2="312" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="480" y1="356" x2="480" y2="396" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase 3 boxes -->
  <rect x="680" y="100" width="240" height="44" rx="6" fill="#24283b" stroke="#ff9e64" stroke-width="1"/>
  <text x="800" y="127" text-anchor="middle" fill="#c0caf5" font-size="12" font-weight="600">/fix-mr reopen</text>

  <rect x="680" y="164" width="240" height="44" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="800" y="191" text-anchor="middle" fill="#a9b1d6" font-size="12">git push</text>

  <rect x="680" y="228" width="240" height="44" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="800" y="248" text-anchor="middle" fill="#a9b1d6" font-size="12">Post summary comment</text>
  <text x="800" y="264" text-anchor="middle" fill="#6a737d" font-size="9" class="mono">glab mr note create</text>

  <rect x="680" y="312" width="240" height="44" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="800" y="332" text-anchor="middle" fill="#a9b1d6" font-size="12">Reopen MR</text>
  <text x="800" y="348" text-anchor="middle" fill="#6a737d" font-size="9" class="mono">glab mr reopen</text>

  <rect x="680" y="396" width="240" height="44" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="2"/>
  <text x="800" y="423" text-anchor="middle" fill="#9ece6a" font-size="14" font-weight="600">Done</text>

  <!-- Phase 3 arrows -->
  <line x1="800" y1="144" x2="800" y2="164" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="800" y1="208" x2="800" y2="228" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="800" y1="272" x2="800" y2="312" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="800" y1="356" x2="800" y2="396" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Cross-phase connectors -->
  <line x1="280" y1="418" x2="360" y2="122" stroke="#6a737d" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="300" y="258" width="48" height="14" rx="2" fill="#1a1b26"/>
  <text x="324" y="269" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">then</text>

  <line x1="600" y1="418" x2="680" y2="122" stroke="#6a737d" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="620" y="258" width="48" height="14" rx="2" fill="#1a1b26"/>
  <text x="644" y="269" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">then</text>
</svg>
