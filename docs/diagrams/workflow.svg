<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Fix-MR Workflow</title>
  <desc id="workflow-desc">Three-phase workflow with optional worktree isolation for parallel fixes</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    text { font-family: 'Geist', sans-serif; }
    .mono { font-family: 'Geist Mono', monospace; }
    .serif { font-family: 'Instrument Serif', serif; }
  </style>

  <!-- Background -->
  <rect width="1100" height="520" fill="#1a1b26"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6a737d"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ece6a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff9e64"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" fill="#c0caf5" font-size="20" font-weight="600" class="serif">Fix-MR Workflow</text>

  <!-- Phase labels -->
  <text x="140" y="76" text-anchor="middle" fill="#7aa2f7" font-size="12" class="mono" letter-spacing="0.1em">REVIEW</text>
  <text x="550" y="76" text-anchor="middle" fill="#9ece6a" font-size="12" class="mono" letter-spacing="0.1em">FIX</text>
  <text x="960" y="76" text-anchor="middle" fill="#ff9e64" font-size="12" class="mono" letter-spacing="0.1em">REOPEN</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 1: REVIEW -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="20" y="92" width="240" height="40" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="1.2"/>
  <text x="140" y="117" text-anchor="middle" fill="#c0caf5" font-size="13" font-weight="600">/fix-mr review</text>

  <rect x="20" y="148" width="240" height="36" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="140" y="171" text-anchor="middle" fill="#a9b1d6" font-size="11">Parse MR URL</text>

  <rect x="20" y="200" width="240" height="36" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="140" y="223" text-anchor="middle" fill="#a9b1d6" font-size="11">Fetch comments</text>
  <text x="140" y="238" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">glab mr view --comments</text>

  <rect x="20" y="252" width="240" height="36" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="140" y="275" text-anchor="middle" fill="#a9b1d6" font-size="11">Classify findings</text>
  <text x="140" y="290" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">valid / invalid / manual</text>

  <rect x="20" y="304" width="240" height="36" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="140" y="327" text-anchor="middle" fill="#a9b1d6" font-size="11">Show table</text>

  <!-- Phase 1 arrows -->
  <line x1="140" y1="132" x2="140" y2="148" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="140" y1="184" x2="140" y2="200" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="140" y1="236" x2="140" y2="252" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="140" y1="288" x2="140" y2="304" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 2: FIX (Standard Path) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="300" y="92" width="260" height="40" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1.2"/>
  <text x="430" y="117" text-anchor="middle" fill="#c0caf5" font-size="13" font-weight="600">/fix-mr fix</text>

  <rect x="300" y="148" width="260" height="36" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="430" y="171" text-anchor="middle" fill="#a9b1d6" font-size="11">Read files &amp; plan fixes</text>

  <rect x="300" y="200" width="260" height="36" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="430" y="223" text-anchor="middle" fill="#a9b1d6" font-size="11">Apply fixes</text>
  <text x="430" y="238" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">code / tests / migrations</text>

  <rect x="300" y="252" width="260" height="36" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="430" y="275" text-anchor="middle" fill="#a9b1d6" font-size="11">Build &amp; test</text>
  <text x="430" y="290" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">go build &amp;&amp; go test</text>

  <rect x="300" y="304" width="260" height="40" rx="6" fill="#24283b" stroke="#e0af68" stroke-width="1.5"/>
  <text x="430" y="329" text-anchor="middle" fill="#e0af68" font-size="12" font-weight="600">git commit</text>
  <text x="430" y="344" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">DO NOT push</text>

  <!-- Phase 2 arrows -->
  <line x1="430" y1="132" x2="430" y2="148" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="430" y1="184" x2="430" y2="200" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="430" y1="236" x2="430" y2="252" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="430" y1="288" x2="430" y2="304" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- WORKTREE BRANCH (Optional Parallel Path) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="620" y="92" width="200" height="260" rx="8" fill="#9ece6a" fill-opacity="0.06" stroke="#9ece6a" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="720" y="116" text-anchor="middle" fill="#9ece6a" font-size="10" font-weight="600" class="mono" letter-spacing="0.08em">--worktree</text>

  <!-- Worktree boxes -->
  <rect x="640" y="136" width="160" height="36" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="720" y="159" text-anchor="middle" fill="#a9b1d6" font-size="11" class="mono">worktree-1 → fix A</text>

  <rect x="640" y="184" width="160" height="36" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="720" y="207" text-anchor="middle" fill="#a9b1d6" font-size="11" class="mono">worktree-2 → fix B</text>

  <text x="720" y="244" text-anchor="middle" fill="#6a737d" font-size="10" class="mono">· · ·</text>

  <rect x="640" y="260" width="160" height="36" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="720" y="283" text-anchor="middle" fill="#a9b1d6" font-size="11" class="mono">worktree-N → fix N</text>

  <!-- Worktree arrows -->
  <line x1="640" y1="154" x2="640" y2="184" stroke="#9ece6a" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="640" y1="220" x2="640" y2="260" stroke="#9ece6a" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Merge box -->
  <rect x="640" y="308" width="160" height="36" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1.2"/>
  <text x="720" y="331" text-anchor="middle" fill="#9ece6a" font-size="11" font-weight="600">Merge passing ✓</text>

  <line x1="720" y1="296" x2="720" y2="308" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow-green)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 3: REOPEN -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="880" y="92" width="200" height="40" rx="6" fill="#24283b" stroke="#ff9e64" stroke-width="1.2"/>
  <text x="980" y="117" text-anchor="middle" fill="#c0caf5" font-size="13" font-weight="600">/fix-mr reopen</text>

  <rect x="880" y="148" width="200" height="36" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="980" y="171" text-anchor="middle" fill="#a9b1d6" font-size="11">git push</text>

  <rect x="880" y="200" width="200" height="36" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="980" y="223" text-anchor="middle" fill="#a9b1d6" font-size="11">Post summary comment</text>
  <text x="980" y="238" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">glab mr note create</text>

  <rect x="880" y="252" width="200" height="36" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="980" y="275" text-anchor="middle" fill="#a9b1d6" font-size="11">Reopen MR</text>
  <text x="980" y="290" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">glab mr reopen</text>

  <rect x="880" y="304" width="200" height="44" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="2"/>
  <text x="980" y="331" text-anchor="middle" fill="#9ece6a" font-size="14" font-weight="600">Done ✓</text>

  <!-- Phase 3 arrows -->
  <line x1="980" y1="132" x2="980" y2="148" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="980" y1="184" x2="980" y2="200" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="980" y1="236" x2="980" y2="252" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="980" y1="288" x2="980" y2="304" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- CROSS-PHASE CONNECTORS -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Review → Fix (standard) -->
  <line x1="260" y1="324" x2="300" y2="112" stroke="#6a737d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="268" y="200" width="36" height="14" rx="2" fill="#1a1b26"/>
  <text x="286" y="211" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">then</text>

  <!-- Review → Worktree (optional) -->
  <line x1="260" y1="324" x2="620" y2="154" stroke="#9ece6a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-green)"/>
  <rect x="400" y="220" width="60" height="14" rx="2" fill="#1a1b26"/>
  <text x="430" y="231" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">or --worktree</text>

  <!-- Worktree merge → Fix commit -->
  <line x1="640" y1="326" x2="560" y2="324" stroke="#9ece6a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-green)"/>
  <rect x="580" y="310" width="36" height="14" rx="2" fill="#1a1b26"/>
  <text x="598" y="321" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">merge</text>

  <!-- Fix → Reopen -->
  <line x1="560" y1="324" x2="880" y2="112" stroke="#6a737d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="700" y="200" width="36" height="14" rx="2" fill="#1a1b26"/>
  <text x="718" y="211" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">then</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <line x1="40" y1="400" x2="1060" y2="400" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>

  <text x="40" y="424" fill="#6a737d" font-size="9" class="mono" letter-spacing="0.1em">LEGEND</text>

  <!-- Standard path -->
  <rect x="140" y="412" width="16" height="16" rx="3" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="164" y="424" fill="#a9b1d6" font-size="9">Standard flow</text>

  <!-- Worktree path -->
  <rect x="280" y="412" width="16" height="16" rx="3" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="304" y="424" fill="#a9b1d6" font-size="9">Worktree isolation (optional)</text>

  <!-- Commit -->
  <rect x="500" y="412" width="16" height="16" rx="3" fill="#24283b" stroke="#e0af68" stroke-width="1"/>
  <text x="524" y="424" fill="#a9b1d6" font-size="9">Commit (no push)</text>

  <!-- Done -->
  <rect x="660" y="412" width="16" height="16" rx="3" fill="#24283b" stroke="#9ece6a" stroke-width="2"/>
  <text x="684" y="424" fill="#a9b1d6" font-size="9">Complete</text>

  <!-- Arrow types -->
  <line x1="820" y1="420" x2="850" y2="420" stroke="#6a737d" stroke-width="1"/>
  <text x="860" y="424" fill="#a9b1d6" font-size="9">Sequential</text>

  <line x1="960" y1="420" x2="990" y2="420" stroke="#6a737d" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="1000" y="424" fill="#a9b1d6" font-size="9">Optional</text>
</svg>
