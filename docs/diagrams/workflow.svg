<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Fix-MR Workflow</title>
  <desc id="workflow-desc">Three-phase workflow: review, fix with optional worktree isolation, reopen</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    text { font-family: 'Geist', sans-serif; }
    .mono { font-family: 'Geist Mono', monospace; }
    .serif { font-family: 'Instrument Serif', serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="480" fill="#1a1b26"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6a737d"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ece6a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="32" text-anchor="middle" fill="#c0caf5" font-size="18" font-weight="600" class="serif">Fix-MR Workflow</text>

  <!-- Phase labels -->
  <text x="150" y="68" text-anchor="middle" fill="#7aa2f7" font-size="11" font-weight="500" class="mono" letter-spacing="0.1em">REVIEW</text>
  <text x="500" y="68" text-anchor="middle" fill="#9ece6a" font-size="11" font-weight="500" class="mono" letter-spacing="0.1em">FIX</text>
  <text x="1050" y="68" text-anchor="middle" fill="#ff9e64" font-size="11" font-weight="500" class="mono" letter-spacing="0.1em">REOPEN</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 1: REVIEW -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="30" y="80" width="240" height="36" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="1.2"/>
  <text x="150" y="103" text-anchor="middle" fill="#c0caf5" font-size="12" font-weight="600">/fix-mr review</text>

  <rect x="30" y="128" width="240" height="32" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="150" y="149" text-anchor="middle" fill="#a9b1d6" font-size="10">Parse MR URL</text>

  <rect x="30" y="172" width="240" height="32" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="150" y="193" text-anchor="middle" fill="#a9b1d6" font-size="10">Fetch comments</text>
  <text x="150" y="206" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">glab mr view --comments</text>

  <rect x="30" y="216" width="240" height="32" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="150" y="237" text-anchor="middle" fill="#a9b1d6" font-size="10">Classify findings</text>
  <text x="150" y="250" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">valid / invalid / manual</text>

  <rect x="30" y="260" width="240" height="32" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="150" y="281" text-anchor="middle" fill="#a9b1d6" font-size="10">Show table</text>

  <!-- Phase 1 arrows -->
  <line x1="150" y1="116" x2="150" y2="128" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="150" y1="160" x2="150" y2="172" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="150" y1="204" x2="150" y2="216" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="150" y1="248" x2="150" y2="260" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 2: FIX (Standard Path - Left) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="340" y="80" width="200" height="36" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1.2"/>
  <text x="440" y="103" text-anchor="middle" fill="#c0caf5" font-size="12" font-weight="600">/fix-mr fix</text>

  <rect x="340" y="128" width="200" height="32" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="440" y="149" text-anchor="middle" fill="#a9b1d6" font-size="10">Read files</text>

  <rect x="340" y="172" width="200" height="32" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="440" y="193" text-anchor="middle" fill="#a9b1d6" font-size="10">Apply fixes</text>
  <text x="440" y="206" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">code / tests / migrations</text>

  <rect x="340" y="216" width="200" height="32" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="440" y="237" text-anchor="middle" fill="#a9b1d6" font-size="10">Build &amp; test</text>
  <text x="440" y="250" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">go build &amp;&amp; go test</text>

  <rect x="340" y="260" width="200" height="36" rx="6" fill="#24283b" stroke="#e0af68" stroke-width="1.5"/>
  <text x="440" y="283" text-anchor="middle" fill="#e0af68" font-size="11" font-weight="600">git commit</text>
  <text x="440" y="296" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">DO NOT push</text>

  <!-- Phase 2 arrows -->
  <line x1="440" y1="116" x2="440" y2="128" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="160" x2="440" y2="172" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="204" x2="440" y2="216" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="248" x2="440" y2="260" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- WORKTREE BRANCH (Optional - Center) -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="600" y="80" width="220" height="220" rx="8" fill="#9ece6a" fill-opacity="0.05" stroke="#9ece6a" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="710" y="100" text-anchor="middle" fill="#9ece6a" font-size="10" font-weight="500" class="mono">--worktree (optional)</text>

  <!-- Worktree boxes - stacked vertically -->
  <rect x="620" y="112" width="180" height="28" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="0.8"/>
  <text x="710" y="131" text-anchor="middle" fill="#a9b1d6" font-size="10" class="mono">wt-1: apply fix A</text>

  <rect x="620" y="148" width="180" height="28" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="0.8"/>
  <text x="710" y="167" text-anchor="middle" fill="#a9b1d6" font-size="10" class="mono">wt-2: apply fix B</text>

  <rect x="620" y="184" width="180" height="28" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="0.8"/>
  <text x="710" y="203" text-anchor="middle" fill="#a9b1d6" font-size="10" class="mono">wt-N: apply fix N</text>

  <text x="710" y="232" text-anchor="middle" fill="#6a737d" font-size="9" class="mono">· · ·</text>

  <rect x="620" y="244" width="180" height="32" rx="4" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="710" y="265" text-anchor="middle" fill="#9ece6a" font-size="10" font-weight="500">Merge passing ✓</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 3: REOPEN -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="920" y="80" width="200" height="36" rx="6" fill="#24283b" stroke="#ff9e64" stroke-width="1.2"/>
  <text x="1020" y="103" text-anchor="middle" fill="#c0caf5" font-size="12" font-weight="600">/fix-mr reopen</text>

  <rect x="920" y="128" width="200" height="32" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="1020" y="149" text-anchor="middle" fill="#a9b1d6" font-size="10">git push</text>

  <rect x="920" y="172" width="200" height="32" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="1020" y="193" text-anchor="middle" fill="#a9b1d6" font-size="10">Post summary comment</text>
  <text x="1020" y="206" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">glab mr note create</text>

  <rect x="920" y="216" width="200" height="32" rx="6" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="1020" y="237" text-anchor="middle" fill="#a9b1d6" font-size="10">Reopen MR</text>
  <text x="1020" y="250" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">glab mr reopen</text>

  <rect x="920" y="260" width="200" height="40" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="2"/>
  <text x="1020" y="285" text-anchor="middle" fill="#9ece6a" font-size="13" font-weight="600">Done ✓</text>

  <!-- Phase 3 arrows -->
  <line x1="1020" y1="116" x2="1020" y2="128" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1020" y1="160" x2="1020" y2="172" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1020" y1="204" x2="1020" y2="216" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1020" y1="248" x2="1020" y2="260" stroke="#6a737d" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- CROSS-PHASE CONNECTORS -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Review → Fix (standard path) -->
  <line x1="270" y1="276" x2="340" y2="98" stroke="#6a737d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="288" y="175" width="32" height="12" rx="2" fill="#1a1b26"/>
  <text x="304" y="185" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">then</text>

  <!-- Review → Worktree (optional path) -->
  <line x1="270" y1="276" x2="600" y2="126" stroke="#9ece6a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <rect x="380" y="185" width="52" height="12" rx="2" fill="#1a1b26"/>
  <text x="406" y="195" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">or worktree</text>

  <!-- Worktree merge → Reopen -->
  <line x1="820" y1="260" x2="920" y2="98" stroke="#9ece6a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
  <rect x="848" y="165" width="32" height="12" rx="2" fill="#1a1b26"/>
  <text x="864" y="175" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">then</text>

  <!-- Fix commit → Reopen -->
  <line x1="540" y1="278" x2="920" y2="98" stroke="#6a737d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="700" y="165" width="32" height="12" rx="2" fill="#1a1b26"/>
  <text x="716" y="175" text-anchor="middle" fill="#6a737d" font-size="8" class="mono">then</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <line x1="30" y1="330" x2="1170" y2="330" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>

  <text x="30" y="354" fill="#6a737d" font-size="9" class="mono" letter-spacing="0.1em">LEGEND</text>

  <rect x="120" y="342" width="14" height="14" rx="3" fill="#24283b" stroke="#4f5d75" stroke-width="1"/>
  <text x="142" y="353" fill="#a9b1d6" font-size="9">Standard flow</text>

  <rect x="280" y="342" width="14" height="14" rx="3" fill="#24283b" stroke="#9ece6a" stroke-width="1"/>
  <text x="302" y="353" fill="#a9b1d6" font-size="9">Worktree (optional)</text>

  <rect x="480" y="342" width="14" height="14" rx="3" fill="#24283b" stroke="#e0af68" stroke-width="1"/>
  <text x="502" y="353" fill="#a9b1d6" font-size="9">Commit</text>

  <rect x="600" y="342" width="14" height="14" rx="3" fill="#24283b" stroke="#9ece6a" stroke-width="2"/>
  <text x="622" y="353" fill="#a9b1d6" font-size="9">Complete</text>

  <line x1="740" y1="349" x2="770" y2="349" stroke="#6a737d" stroke-width="1"/>
  <text x="780" y="353" fill="#a9b1d6" font-size="9">Sequential</text>

  <line x1="900" y1="349" x2="930" y2="349" stroke="#6a737d" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="940" y="353" fill="#a9b1d6" font-size="9">Optional</text>
</svg>
