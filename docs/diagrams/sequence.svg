<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="seq-title seq-desc">
  <title id="seq-title">Fix-MR Sequence Diagram</title>
  <desc id="seq-desc">Interaction between Developer, Claude Code, and GitLab API across three phases: review, fix (with optional worktree isolation), reopen</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    text { font-family: 'Geist', sans-serif; }
    .mono { font-family: 'Geist Mono', monospace; }
    .serif { font-family: 'Instrument Serif', serif; }
  </style>

  <!-- Background -->
  <rect width="800" height="720" fill="#1a1b26"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#c0caf5" font-size="18" font-weight="600" class="serif">Fix-MR Sequence</text>

  <!-- Participants -->
  <rect x="100" y="60" width="120" height="36" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="1.2"/>
  <text x="160" y="83" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="600">Developer</text>

  <rect x="340" y="60" width="120" height="36" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1.2"/>
  <text x="400" y="83" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="600">Claude Code</text>

  <rect x="580" y="60" width="120" height="36" rx="6" fill="#24283b" stroke="#ff9e64" stroke-width="1.2"/>
  <text x="640" y="83" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="600">GitLab API</text>

  <!-- Lifelines -->
  <line x1="160" y1="96" x2="160" y2="600" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="400" y1="96" x2="400" y2="600" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="640" y1="96" x2="640" y2="600" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Phase 1: REVIEW -->
  <rect x="40" y="112" width="720" height="140" rx="4" fill="#7aa2f7" fill-opacity="0.06" stroke="#7aa2f7" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="56" y="128" fill="#7aa2f7" font-size="9" class="mono" letter-spacing="0.1em">PHASE 1: REVIEW</text>

  <line x1="160" y1="144" x2="388" y2="144" stroke="#a9b1d6" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="210" y="134" width="100" height="14" rx="2" fill="#1a1b26"/>
  <text x="260" y="144" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">/fix-mr review</text>

  <line x1="400" y1="172" x2="628" y2="172" stroke="#ff9e64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="440" y="162" width="120" height="14" rx="2" fill="#1a1b26"/>
  <text x="500" y="172" text-anchor="middle" fill="#ff9e64" font-size="8" class="mono">glab mr view --comments</text>

  <line x1="628" y1="200" x2="412" y2="200" stroke="#ff9e64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="440" y="190" width="120" height="14" rx="2" fill="#1a1b26"/>
  <text x="500" y="200" text-anchor="middle" fill="#ff9e64" font-size="8" class="mono">MR metadata + comments</text>

  <line x1="388" y1="228" x2="172" y2="228" stroke="#a9b1d6" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="200" y="218" width="160" height="14" rx="2" fill="#1a1b26"/>
  <text x="280" y="228" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">table: valid / invalid / manual</text>

  <!-- Phase 2: FIX -->
  <rect x="40" y="264" width="720" height="180" rx="4" fill="#9ece6a" fill-opacity="0.06" stroke="#9ece6a" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="56" y="280" fill="#9ece6a" font-size="9" class="mono" letter-spacing="0.1em">PHASE 2: FIX [--worktree optional]</text>

  <line x1="160" y1="300" x2="388" y2="300" stroke="#a9b1d6" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="216" y="290" width="88" height="14" rx="2" fill="#1a1b26"/>
  <text x="260" y="300" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">/fix-mr fix</text>

  <!-- Worktree branch (optional) -->
  <rect x="340" y="316" width="120" height="80" rx="4" fill="#9ece6a" fill-opacity="0.06" stroke="#9ece6a" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="352" y="330" fill="#9ece6a" font-size="7" class="mono">if --worktree:</text>
  <rect x="352" y="340" width="96" height="16" rx="3" fill="#24283b" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="400" y="351" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">create worktrees</text>
  <rect x="352" y="360" width="96" height="16" rx="3" fill="#24283b" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="400" y="371" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">fix per worktree</text>
  <rect x="352" y="380" width="96" height="16" rx="3" fill="#24283b" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="400" y="391" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">merge passing</text>

  <!-- Standard flow -->
  <rect x="352" y="412" width="96" height="20" rx="4" fill="#24283b" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="400" y="426" text-anchor="middle" fill="#a9b1d6" font-size="9" class="mono">apply fixes</text>

  <rect x="352" y="440" width="96" height="20" rx="4" fill="#24283b" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="400" y="454" text-anchor="middle" fill="#a9b1d6" font-size="9" class="mono">build + test</text>

  <rect x="352" y="468" width="96" height="20" rx="4" fill="#24283b" stroke="#e0af68" stroke-width="1"/>
  <text x="400" y="482" text-anchor="middle" fill="#e0af68" font-size="9" font-weight="600" class="mono">git commit</text>

  <line x1="388" y1="500" x2="172" y2="500" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="216" y="490" width="120" height="14" rx="2" fill="#1a1b26"/>
  <text x="276" y="500" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">ready (no push)</text>

  <!-- Phase 3: REOPEN -->
  <rect x="40" y="520" width="720" height="160" rx="4" fill="#ff9e64" fill-opacity="0.06" stroke="#ff9e64" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="56" y="536" fill="#ff9e64" font-size="9" class="mono" letter-spacing="0.1em">PHASE 3: REOPEN</text>

  <line x1="160" y1="556" x2="388" y2="556" stroke="#a9b1d6" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="216" y="546" width="88" height="14" rx="2" fill="#1a1b26"/>
  <text x="260" y="556" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">/fix-mr reopen</text>

  <line x1="400" y1="584" x2="628" y2="584" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="456" y="574" width="72" height="14" rx="2" fill="#1a1b26"/>
  <text x="492" y="584" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">git push</text>

  <line x1="400" y1="612" x2="628" y2="612" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="444" y="602" width="96" height="14" rx="2" fill="#1a1b26"/>
  <text x="492" y="612" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">post comment</text>

  <line x1="400" y1="640" x2="628" y2="640" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="456" y="630" width="72" height="14" rx="2" fill="#1a1b26"/>
  <text x="492" y="640" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">reopen MR</text>

  <line x1="628" y1="668" x2="172" y2="668" stroke="#9ece6a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="280" y="658" width="88" height="14" rx="2" fill="#1a1b26"/>
  <text x="324" y="668" text-anchor="middle" fill="#9ece6a" font-size="8" font-weight="600" class="mono">DONE</text>
</svg>
