<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" role="img" aria-labelledby="seq-title seq-desc">
  <title id="seq-title">Fix-MR Sequence</title>
  <desc id="seq-desc">Developer, Claude, and GitLab interaction across review, fix, and reopen phases</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap');
    text { font-family: 'Geist', sans-serif; }
    .mono { font-family: 'Geist Mono', monospace; }
  </style>

  <rect width="700" height="450" fill="#1a1b26"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6a737d"/>
    </marker>
  </defs>

  <!-- Participants -->
  <rect x="60" y="20" width="100" height="32" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="1.2"/>
  <text x="110" y="41" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="600">Developer</text>

  <rect x="290" y="20" width="100" height="32" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1.2"/>
  <text x="340" y="41" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="600">Claude</text>

  <rect x="520" y="20" width="100" height="32" rx="6" fill="#24283b" stroke="#ff9e64" stroke-width="1.2"/>
  <text x="570" y="41" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="600">GitLab</text>

  <!-- Lifelines -->
  <line x1="110" y1="52" x2="110" y2="440" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="340" y1="52" x2="340" y2="440" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="570" y1="52" x2="570" y2="440" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Phase 1: REVIEW -->
  <rect x="20" y="64" width="660" height="100" rx="4" fill="#7aa2f7" fill-opacity="0.06" stroke="#7aa2f7" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="36" y="80" fill="#7aa2f7" font-size="9" class="mono" letter-spacing="0.1em">REVIEW</text>

  <line x1="110" y1="92" x2="328" y2="92" stroke="#a9b1d6" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="170" y="82" width="80" height="14" rx="2" fill="#1a1b26"/>
  <text x="210" y="92" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">/fix-mr review</text>

  <line x1="352" y1="112" x2="558" y2="112" stroke="#ff9e64" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="400" y="102" width="80" height="14" rx="2" fill="#1a1b26"/>
  <text x="440" y="112" text-anchor="middle" fill="#ff9e64" font-size="8" class="mono">glab mr view</text>

  <line x1="558" y1="136" x2="352" y2="136" stroke="#ff9e64" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="410" y="126" width="100" height="14" rx="2" fill="#1a1b26"/>
  <text x="460" y="136" text-anchor="middle" fill="#ff9e64" font-size="8" class="mono">metadata + comments</text>

  <line x1="328" y1="152" x2="122" y2="152" stroke="#a9b1d6" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="170" y="142" width="110" height="14" rx="2" fill="#1a1b26"/>
  <text x="225" y="152" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">table of findings</text>

  <!-- Phase 2: FIX -->
  <rect x="20" y="176" width="660" height="120" rx="4" fill="#9ece6a" fill-opacity="0.06" stroke="#9ece6a" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="36" y="192" fill="#9ece6a" font-size="9" class="mono" letter-spacing="0.1em">FIX [--worktree]</text>

  <line x1="110" y1="208" x2="328" y2="208" stroke="#a9b1d6" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="170" y="198" width="80" height="14" rx="2" fill="#1a1b26"/>
  <text x="210" y="208" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">/fix-mr fix</text>

  <rect x="300" y="220" width="80" height="16" rx="4" fill="#24283b" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="340" y="231" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">apply fixes</text>

  <rect x="300" y="244" width="80" height="16" rx="4" fill="#24283b" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="340" y="255" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">build + test</text>

  <rect x="300" y="268" width="80" height="16" rx="4" fill="#24283b" stroke="#e0af68" stroke-width="1"/>
  <text x="340" y="279" text-anchor="middle" fill="#e0af68" font-size="8" font-weight="600" class="mono">commit</text>

  <line x1="328" y1="288" x2="122" y2="288" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="170" y="278" width="100" height="14" rx="2" fill="#1a1b26"/>
  <text x="220" y="288" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">ready (no push)</text>

  <!-- Phase 3: REOPEN -->
  <rect x="20" y="308" width="660" height="120" rx="4" fill="#ff9e64" fill-opacity="0.06" stroke="#ff9e64" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="36" y="324" fill="#ff9e64" font-size="9" class="mono" letter-spacing="0.1em">REOPEN</text>

  <line x1="110" y1="340" x2="328" y2="340" stroke="#a9b1d6" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="170" y="330" width="80" height="14" rx="2" fill="#1a1b26"/>
  <text x="210" y="340" text-anchor="middle" fill="#a9b1d6" font-size="8" class="mono">/fix-mr reopen</text>

  <line x1="352" y1="364" x2="558" y2="364" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="420" y="354" width="60" height="14" rx="2" fill="#1a1b26"/>
  <text x="450" y="364" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">push</text>

  <line x1="352" y1="388" x2="558" y2="388" stroke="#9ece6a" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="400" y="378" width="100" height="14" rx="2" fill="#1a1b26"/>
  <text x="450" y="388" text-anchor="middle" fill="#9ece6a" font-size="8" class="mono">post comment + reopen</text>

  <line x1="558" y1="412" x2="122" y2="412" stroke="#9ece6a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="290" y="402" width="56" height="14" rx="2" fill="#1a1b26"/>
  <text x="318" y="412" text-anchor="middle" fill="#9ece6a" font-size="8" font-weight="600" class="mono">DONE</text>
</svg>
